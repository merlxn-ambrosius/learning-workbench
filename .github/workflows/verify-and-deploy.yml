name: Verify and deploy LEARN

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learn-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate teaching mechanics
        run: npm test
      - name: Check deployed entrypoints
        run: |
          test -f site/index.html
          test -f site/app.js
          test -f site/data/atlas.json
          node --check site/app.js
          node --check site/logic.mjs
      - name: Validate versioned Pages resources
        run: python3 tools/verify_pages.py build "$RUNNER_TEMP/learn-pages" "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chinese fonts for layout checks
        run: |
          if ! dpkg-query -W -f='${db:Status-Status}' fonts-noto-cjk 2>/dev/null | grep -qx installed; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
      - name: Exercise learning and recovery flows in Chrome
        run: |
          python -m pip install playwright==1.62.0
          python tools/browser_smoke.py --site-dir "$RUNNER_TEMP/learn-pages" --verify-cjk-font --screenshots "$RUNNER_TEMP/learn-review"
      - name: Install isolated browser-test dependency
        run: npm install --prefix "$RUNNER_TEMP/learn-browser" --no-save --ignore-scripts playwright@1.62.1
      - name: Verify course, shared knowledge and returning-learner journeys
        env:
          LEARN_PREVIEW_URL: http://127.0.0.1:4174/
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          python tools/serve_local.py --port 4174 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          PW_MODULE="$RUNNER_TEMP/learn-browser/node_modules/playwright/index.mjs"
          node tools/architecture_smoke.mjs "$RUNNER_TEMP/learn-review/architecture" "$PW_MODULE"
          node tools/world_smoke.mjs "$RUNNER_TEMP/learn-review/journey" "$PW_MODULE"
          node tools/discovery_smoke.mjs "$RUNNER_TEMP/learn-review/studio" "$PW_MODULE"
          node tools/knowledge_map_smoke.mjs "$RUNNER_TEMP/learn-review/map" "$PW_MODULE"
      - name: Save disposable-profile layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-layouts
          path: ${{ runner.temp }}/learn-review
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare versioned Pages resources
        run: python3 tools/verify_pages.py build "$RUNNER_TEMP/learn-pages" "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/learn-pages
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public site matches this commit
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tools/verify_pages.py check "$RUNNER_TEMP/learn-pages" "$PAGES_URL"
