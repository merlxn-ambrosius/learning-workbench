name: Verify and deploy LEARN

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learn-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate teaching mechanics
        run: npm test
      - name: Check deployed entrypoints
        run: |
          test -f site/index.html
          test -f site/app.js
          test -f site/data/atlas.json
          node --check site/app.js
          node --check site/logic.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise learning and recovery flows in Chrome
        run: |
          python -m pip install playwright==1.62.0
          python tools/browser_smoke.py --screenshots "$RUNNER_TEMP/learn-review"
      - name: Save disposable-profile layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-layouts
          path: ${{ runner.temp }}/learn-review
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
