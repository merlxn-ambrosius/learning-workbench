name: 新增或改进学习单元
about: 从真实学习困难出发添加交互，而不是扩建空目录
labels: ["education"]
body:
  - type: textarea
    id: difficulty
    attributes:
      label: 真实学习困难
      description: 学习者无法解释、推导、实现、调试或迁移的具体机制是什么？
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 外部课程或原始资料
      description: 尽量给出原题、文档版本、原始代码或实验。
  - type: textarea
    id: proposed-interaction
    attributes:
      label: 最小有效交互
      description: 哪种组件比静态例解更有帮助？如何观察？
  - type: textarea
    id: verify
    attributes:
      label: 如何发现它的失败
      description: 包括可执行测试和学习者可完成的陌生变化。
